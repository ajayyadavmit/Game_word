<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Word Fix</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1 id="title">Word Fix</h1>

  <div id="stage">
    <p id="error" class="error" hidden></p>

    <section id="home">
      <p id="rules"></p>
      <h2>Your nickname</h2>
      <div id="nicks" class="chips"></div>
      <button id="reroll" type="button" class="ghost">Show other names</button>
      <h2>Difficulty</h2>
      <div id="levels" class="chips"></div>
      <h2>Topic</h2>
      <select id="domain" aria-label="Topic"></select>
      <p id="playinfo" class="small"></p>
      <button id="play" type="button" class="primary" disabled>Play</button>
    </section>

    <section id="game" hidden>
      <div class="bar"><span id="round"></span><span>Score: <b id="score">0</b></span></div>
      <div id="tiles" class="tiles"></div>
      <p id="hint" class="small"></p>
      <div id="opts" class="opts"></div>
      <p id="msg" class="msg" aria-live="polite"></p>
      <button id="next" type="button" class="primary" hidden>Next word</button>
    </section>

    <section id="end" hidden>
      <h2>Your score</h2>
      <p class="big" id="final"></p>
      <p id="summary"></p>
      <p id="submitmsg"></p>
      <button id="submit" type="button" class="primary" hidden>Send score to leaderboard</button>
      <button id="again" type="button" class="ghost">Play again</button>
    </section>
  </div>

  <aside>
    <h2>Leaderboard</h2>
    <div id="tabs" class="chips"></div>
    <ol id="rows"></ol>
    <p id="boardmsg"></p>
    <p id="modeinfo" class="small"></p>
  </aside>
</main>
<script src="game.js"></script>
</body>
</html>
