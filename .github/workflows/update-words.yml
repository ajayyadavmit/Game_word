name: Update words
on:
  workflow_dispatch:
    inputs:
      domain:
        description: "Domain name, e.g. science, language, history, mathematics, philosophy, psychology, sociology, economics, literature, engineering, medicine, law, education, arts, geography"
        required: true
        default: education
      query:
        description: "Topic to find words for, e.g. education"
        required: true
        default: education
      count:
        description: "How many words to add"
        default: "30"
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/update_words.py 2>&1 | tee run.log
        shell: bash
        env:
          DOMAIN: ${{ inputs.domain }}
          QUERY: ${{ inputs.query }}
          COUNT: ${{ inputs.count }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: claude-sonnet-5-5 # only used when the API key is set
      - name: Save words
        run: |
          {
            git config user.name "words-bot"
            git config user.email "words-bot@users.noreply.github.com"
            git add words.json
            git diff --cached --quiet || (git commit -m "Update words" && git pull --rebase && git push)
          } 2>&1 | tee -a run.log
        shell: bash
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: update-words-run-log-${{ github.run_id }}
          path: run.log
          if-no-files-found: ignore
