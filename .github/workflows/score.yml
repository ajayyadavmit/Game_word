name: Add score to leaderboard
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  add:
    if: startsWith(github.event.issue.title, 'SCORE|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: python scripts/process_score.py 2>&1 | tee run.log
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
      - name: Save leaderboard
        if: steps.p.outputs.accepted == 'true'
        run: |
          {
            git config user.name "leaderboard-bot"
            git config user.email "leaderboard-bot@users.noreply.github.com"
            git add leaderboard.json
            git diff --cached --quiet || (git commit -m "Update leaderboard" && git pull --rebase && git push)
          } 2>&1 | tee -a run.log
        shell: bash
      - name: Close issue
        if: steps.p.outputs.accepted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.p.outputs.msg }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue close "$NUM" --comment "$MSG" 2>&1 | tee -a run.log
        shell: bash
      - name: Comment with rejection reason
        if: steps.p.outputs.accepted == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.p.outputs.msg }}
          NUM: ${{ github.event.issue.number }}
        run: gh issue comment "$NUM" --body "$MSG" 2>&1 | tee -a run.log
        shell: bash
      - name: Upload run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: score-run-log-${{ github.run_id }}
          path: run.log
          if-no-files-found: ignore
